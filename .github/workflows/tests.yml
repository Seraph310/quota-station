name: Windows offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          foreach ($path in @('install.ps1', 'setup_desktop.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Run offline unit and widget tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Render isolated demo smoke test
        run: python tools/render_demo.py
      - name: Check that private runtime files are not tracked
        shell: powershell
        run: |
          $privateFiles = @(git ls-files -- state .cache .venv qa tests/artifacts 'tests/*_verification.json' '*.log')
          if ($privateFiles.Count) { throw ('Private runtime files must not be tracked: ' + ($privateFiles -join ', ')) }
          git diff --exit-code -- state .cache
          if ($LASTEXITCODE -ne 0) { throw 'Production state changed during offline tests.' }
