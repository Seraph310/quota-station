name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a draft Release after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x64
          - runner: macos-15
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build and test the packaged executable
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.artifact }}
          path: build/smoke/
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: 'package-*'
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums and a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$TAG" ]; then TAG="v$(python -c 'from version import __version__; print(__version__)')"; fi
          if git rev-parse --verify "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          cd release-artifacts
          sha256sum QuotaStation-*.zip QuotaStation-*.dmg > SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > ../release-is-draft.txt; then
            if [ "$(cat ../release-is-draft.txt)" != 'true' ]; then
              echo 'Release is already published; keeping its verified assets unchanged.'
              exit 0
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "额度小站 $TAG" --notes-file ../docs/RELEASE.md
            gh release upload "$TAG" QuotaStation-*.zip QuotaStation-*.dmg SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" QuotaStation-*.zip QuotaStation-*.dmg SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "额度小站 $TAG" --notes-file ../docs/RELEASE.md
          fi
